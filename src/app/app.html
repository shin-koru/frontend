<shin-header />
<div class="route-content"><router-outlet /></div>
<shin-footer />
<p class="sr-only" role="status" aria-live="polite">{{ watchlist.notice() }}</p>
<shin-modal
  [heading]="playback.movie()?.title || ''"
  [open]="!!playback.movie()"
  (closed)="playback.close()"
>
  <div class="stack">
    @if (playback.url()) {
      <video
        class="movie-player"
        [src]="playback.url()"
        controls
        playsinline
        preload="metadata"
        aria-label="Movie player"
      ></video>
    } @else if (playback.loading()) {
      <p role="status">Loading video…</p>
    } @else {
      <h2>Streaming is coming soon.</h2>
      <p class="muted">
        This is a preview of the SHIN collection. This title is not yet available to play. Save it
        to your list for a future movie night.
      </p>
    }
  </div>
</shin-modal>
<shin-notifications />
