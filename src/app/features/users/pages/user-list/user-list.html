<section class="page">
  <header class="page-header">
    <div>
      <h1>Users</h1>
      <p class="page-subtitle">Create, view, update, and delete user accounts.</p>
    </div>
    <p-button label="New user" (onClick)="createUser()" />
  </header>

  <div class="toolbar">
    <input pInputText [formControl]="searchControl" placeholder="Search users" class="search" />
  </div>

  <p-table [value]="users()" [loading]="loading()" [paginator]="true" [rows]="10" [rowHover]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Username</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th style="width: 16rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.firstName }} {{ user.lastName }}</td>
        <td>{{ user.email }}</td>
        <td>
          <p-tag [value]="user.role" [severity]="user.role === 'admin' ? 'danger' : 'info'" />
        </td>
        <td>
          <p-tag
            [value]="user.isActive ? 'Active' : 'Inactive'"
            [severity]="user.isActive ? 'success' : 'secondary'"
          />
        </td>
        <td>
          <div class="actions">
            <p-button label="View" [outlined]="true" size="small" (onClick)="viewUser(user)" />
            <p-button label="Edit" [outlined]="true" size="small" (onClick)="editUser(user)" />
            <p-button
              label="Delete"
              severity="danger"
              [outlined]="true"
              size="small"
              (onClick)="confirmDelete(user)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">No users found.</td>
      </tr>
    </ng-template>
  </p-table>
</section>
